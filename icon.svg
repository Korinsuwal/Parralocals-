<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080E18"/>
      <stop offset="100%" stop-color="#04070D"/>
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#00FF88"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="rgba(0,240,255,0.25)" stroke-width="6"/>

  <!-- Stopwatch Ring with Neon Glow -->
  <circle cx="256" cy="270" r="140" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="22"/>
  <circle cx="256" cy="270" r="140" fill="none" stroke="url(#neonGlow)" stroke-width="22" stroke-linecap="round" stroke-dasharray="660" stroke-dashoffset="180" filter="url(#glow)"/>

  <!-- Top Crown -->
  <rect x="236" y="70" width="40" height="40" rx="8" fill="#00F0FF"/>
  <rect x="246" y="105" width="20" height="25" fill="#00F0FF"/>

  <!-- Center Lightning Bolt (Electric Neon) -->
  <path d="M 275 185 L 210 280 L 260 280 L 235 355 L 310 255 L 260 255 Z" fill="#00FF88" filter="url(#glow)"/>
</svg>
